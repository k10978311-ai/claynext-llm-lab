[project]
name = "claynext-llm-lab"
version = "0.1.0"
description = "Claynext LLM Lab — Khmer spoken datasets, Gemini/Jev collection, and training dry-runs (no Studio GUI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk>=0.7.5",
]

[project.optional-dependencies]
gateway = [
    "httpx>=0.27",
]

[project.scripts]
claynext-llm = "claynext.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claynext"]
